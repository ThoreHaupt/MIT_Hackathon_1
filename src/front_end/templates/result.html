<!DOCTYPE html>
<html>
<head>
    <title>Route Results</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map { height: 500px; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Route from {{ origin }} to {{ destination }} via {{ mode }}</h2>

    <ul>
        {% for step in route.steps %}
        <li>{{ step }}</li>
        {% endfor %}
    </ul>

    <p>Estimated Time: {{ route.duration }}</p>
    <p>Estimated Cost: {{ route.cost_estimate }}</p>

    <div id="map"></div>

    <a href="/">Plan Another</a>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        const segments = {{ route.segments | tojson }};
        const modeColors = {
            "Truck": "blue",
            "Train": "green",
            "Ship": "navy",
            "Air": "red"
        };

        const map = L.map('map').setView(segments[0].path[0], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Draw each segment with color by mode
        segments.forEach(segment => {
            const color = modeColors[segment.mode] || 'gray';
            L.polyline(segment.path, { color: color, weight: 5 }).addTo(map)
                .bindPopup(`Mode: ${segment.mode}`);
        });

        // Add markers at start and end
        L.marker(segments[0].path[0]).addTo(map).bindPopup("Origin").openPopup();
        L.marker(segments[segments.length - 1].path[1]).addTo(map).bindPopup("Destination");
    </script>

</body>
</html>
