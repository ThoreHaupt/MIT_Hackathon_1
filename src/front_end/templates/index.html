<!DOCTYPE html>
<html>
<head>
    <title>Freight Path Planner</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        #map { height: 400px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Freight Path Planner</h1>

    <form action="/route" method="post">
        <label>Origin:</label>
        <input type="text" name="origin" placeholder="e.g. New York" required><br>

        <label>Destination:</label>
        <input type="text" name="destination" placeholder="e.g. Los Angeles" required><br>

        <label>Mode of Transport:</label>
        <select name="mode">
            <option value="Truck">Truck</option>
            <option value="Train">Train</option>
            <option value="Ship">Ship</option>
            <option value="Air">Air</option>
        </select><br>

        <button type="submit">Plan Route</button>
    </form>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([42.36018610476105, -71.09414927401798], 4); // MIT

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Optional: Common freight hubs
        const hubs = [];

        hubs.forEach(hub => {
            L.marker(hub.coords).addTo(map).bindPopup(hub.name);
        });
    </script>
    <script>
        // Geolocation to auto-fill origin
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
    
                // Fill origin input with coordinates (you can reverse geocode if needed)
                document.querySelector('input[name="origin"]').value = `${lat},${lon}`;
    
                // Center map on user's location
                const userLocation = [lat, lon];
                map.setView(userLocation, 8);
                L.marker(userLocation).addTo(map).openPopup();
            }, function(error) {
                console.error("Geolocation failed:", error);
            });
        } else {
            console.warn("Geolocation is not supported by this browser.");
        }
    </script>
    
</body>
</html>
