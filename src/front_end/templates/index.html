<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
</head>
<body>
    <div id="map" class="absolute inset-0 z-0"></div>
    <div class="absolute z-10 top-10 left-20 max-w-md mx-auto mt-10 bg-white/90 shadow-lg rounded-xl p-6">
        <div class="space-y-4 w-96">
            <div>
                <label for="origin" class="block text-sm font-medium text-gray-700">Source:</label>
                <div class="mt-1 flex items-center">
                    <input type="text" id="origin" name="origin" placeholder="300 Vanderbilt Ave, Brooklyn, NY 11205, USA" required 
                    class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                    <button type="button" id="use-location-source" class="ml-2 border border-gray-300 rounded-md shadow-sm text-gray-500 hover:text-gray-700 focus:border-indigo-500 focus:ring-indigo-500" title="Use my location">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xml:space="preserve" class="h-9 w-9">
                            <path fill="#2563eb" d="M100.232 149.198c-2.8 0-5.4-1.8-7.2-5.2-22.2-41-22.4-41.4-22.4-41.6-3.2-5.1-4.9-11.3-4.9-17.6 0-19.1 15.5-34.6 34.6-34.6s34.6 15.5 34.6 34.6c0 6.5-1.8 12.8-5.2 18.2 0 0-1.2 2.4-22.2 41-1.9 3.4-4.4 5.2-7.3 5.2zm.1-95c-16.9 0-30.6 13.7-30.6 30.6 0 5.6 1.5 11.1 4.5 15.9.6 1.3 16.4 30.4 22.4 41.5 2.1 3.9 5.2 3.9 7.4 0 7.5-13.8 21.7-40.1 22.2-41 3.1-5 4.7-10.6 4.7-16.3-.1-17-13.8-30.7-30.6-30.7z"/>
                            <path fill="#2563eb" d="M100.332 105.598c-10.6 0-19.1-8.6-19.1-19.1s8.5-19.2 19.1-19.2c10.6 0 19.1 8.6 19.1 19.1s-8.6 19.2-19.1 19.2zm0-34.3c-8.3 0-15.1 6.8-15.1 15.1s6.8 15.1 15.1 15.1 15.1-6.8 15.1-15.1-6.8-15.1-15.1-15.1z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div>
                <label for="destination" class="block text-sm font-medium text-gray-700">Source:</label>
                <div class="mt-1 flex items-center">
                    <input type="text" id="destination" name="destination" placeholder="9551-9567 Gregory Way, Beverly Hills, CA 90212, USA" required 
                    class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                    <button type="button" id="use-location-destination" class="ml-2 border border-gray-300 rounded-md shadow-sm text-gray-500 hover:text-gray-700 focus:border-indigo-500 focus:ring-indigo-500" title="Use my location">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xml:space="preserve" class="h-9 w-9">
                            <path fill="#2563eb" d="M100.232 149.198c-2.8 0-5.4-1.8-7.2-5.2-22.2-41-22.4-41.4-22.4-41.6-3.2-5.1-4.9-11.3-4.9-17.6 0-19.1 15.5-34.6 34.6-34.6s34.6 15.5 34.6 34.6c0 6.5-1.8 12.8-5.2 18.2 0 0-1.2 2.4-22.2 41-1.9 3.4-4.4 5.2-7.3 5.2zm.1-95c-16.9 0-30.6 13.7-30.6 30.6 0 5.6 1.5 11.1 4.5 15.9.6 1.3 16.4 30.4 22.4 41.5 2.1 3.9 5.2 3.9 7.4 0 7.5-13.8 21.7-40.1 22.2-41 3.1-5 4.7-10.6 4.7-16.3-.1-17-13.8-30.7-30.6-30.7z"/>
                            <path fill="#2563eb" d="M100.332 105.598c-10.6 0-19.1-8.6-19.1-19.1s8.5-19.2 19.1-19.2c10.6 0 19.1 8.6 19.1 19.1s-8.6 19.2-19.1 19.2zm0-34.3c-8.3 0-15.1 6.8-15.1 15.1s6.8 15.1 15.1 15.1 15.1-6.8 15.1-15.1-6.8-15.1-15.1-15.1z"/>
                        </svg>
                    </button>
                </div>
            </div>
        
            <div>
                <label class="block text-sm font-medium text-gray-700">Mode of Transport:</label>
                <div class="mt-2 space-y-2">
                <div class="flex items-center">
                    <input id="truck" type="checkbox" name="truckCheckBox" value="Truck" checked
                    class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                    <label for="truck" class="ml-2 block text-sm text-gray-700">Truck</label>
                </div>
                <div class="flex items-center">
                    <input id="train" type="checkbox" name="trainCheckBox" value="Train" checked
                    class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                    <label for="train" class="ml-2 block text-sm text-gray-700">Train</label>
                </div>
                <div class="flex items-center">
                    <input id="ship" type="checkbox" name="shipCheckBox" value="Ship" checked
                    class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                    <label for="ship" class="ml-2 block text-sm text-gray-700">Ship</label>
                </div>
                <div class="flex items-center">
                    <input id="air" type="checkbox" name="airCheckBox" value="Air" checked
                    class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                    <label for="air" class="ml-2 block text-sm text-gray-700">Air</label>
                </div>
                </div>
            </div>

            <label for="time-slider" class="block text-sm font-medium text-gray-700">Importance of Time:</label>
            <input id="time-slider" type="range" min="0" max="10" value="5" class="w-full h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer">

            <label for="co2-slider" class="block text-sm font-medium text-gray-700">Importance of CO2:</label>
            <input id="co2-slider" type="range" min="0" max="10" value="5" class="w-full h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer">

            <label for="money-slider" class="block text-sm font-medium text-gray-700">Importance of Money:</label>
            <input id="money-slider" type="range" min="0" max="10" value="5" class="w-full h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer">

            <label for="risk-slider" class="block text-sm font-medium text-gray-700">Importance of Risk:</label>
            <input id="risk-slider" type="range" min="0" max="10" value="5" class="w-full h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer">


            <script>
                const timeSlider = document.getElementById('time-slider');
                const timeValue = document.getElementById('time-value');

                timeSlider.addEventListener('input', function() {
                    timeValue.textContent = timeSlider.value;
                });
            </script>
            
            <div>
                <button type="submit"
                onclick="loadRoute()"
                class="w-full inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Plan Route
                </button>
            </div>
        </div>
    </div>



    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', {zoomControl: false}).setView([42.36018610476105, -71.09414927401798], 4); // MIT
        L.control.zoom({
            position: 'bottomright'
        }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Optional: Common freight hubs
        const hubs = [];

        hubs.forEach(hub => {
            L.marker(hub.coords).addTo(map).bindPopup(hub.name);
        });
    </script>
    <script>
        function useLocation(buttonId, inputName) {
            document.getElementById(buttonId).addEventListener('click', function() {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;

                        // Fill input with coordinates (you can reverse geocode if needed)
                        document.querySelector(`input[name="${inputName}"]`).value = `${lat}, ${lon}`;

                        // Center map on user's location
                        const userLocation = [lat, lon];
                        map.setView(userLocation, 8);
                        L.marker(userLocation).addTo(map).openPopup();
                    }, function(error) {
                        console.error("Geolocation failed:", error);
                        alert("Unable to retrieve your location. Please try again.");
                    });
                } else {
                    alert("Geolocation is not supported by this browser.");
                }
            });
        }

        useLocation('use-location-source', 'origin');
        useLocation('use-location-destination', 'destination');
    </script>

    <script>
        function loadRoute() {
            const formData = new FormData();
            formData.append('origin', document.getElementById('origin').value);
            formData.append('destination', document.getElementById('destination').value);
            formData.append('truckCheckBox', document.getElementById('truck').checked ? 'on' : '');
            formData.append('trainCheckBox', document.getElementById('train').checked ? 'on' : '');
            formData.append('shipCheckBox', document.getElementById('ship').checked ? 'on' : '');
            formData.append('airCheckBox', document.getElementById('air').checked ? 'on' : '');
            formData.append('timeImportance', document.getElementById('time-slider').value);
            formData.append('co2Importance', document.getElementById('co2-slider').value);
            formData.append('moneyImportance', document.getElementById('money-slider').value);
            formData.append('riskImportance', document.getElementById('risk-slider').value);

            fetch('http://localhost:5000/route', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(route => {
                const segments = route.segments;
                const modeColors = {
                    "Truck": "blue",
                    "Train": "green",
                    "Ship": "navy",
                    "Air": "red"
                };

                // Clear existing layers from the map
                map.eachLayer(layer => {
                    if (!layer._url) { // Keep the tile layer
                        map.removeLayer(layer);
                    }
                });

                // Draw each segment with color by mode
                segments.forEach(segment => {
                    const color = modeColors[segment.mode] || 'gray';
                    L.polyline(segment.path, { color: color, weight: 5 }).addTo(map)
                        .bindPopup(`Mode: ${segment.mode}`);
                });

                // Add markers at start and end
                L.marker(segments[0].path[0]).addTo(map).bindPopup("Origin").openPopup();
                L.marker(segments[segments.length - 1].path[1]).addTo(map).bindPopup("Destination");

                // Adjust map view to fit all segments
                const allCoordinates = segments.flatMap(segment => segment.path);
                const bounds = L.latLngBounds(allCoordinates);
                map.fitBounds(bounds);
            })
            .catch(error => console.error('Error fetching route:', error));
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
</body>
</html>
