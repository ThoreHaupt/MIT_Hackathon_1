<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transport Planning Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Form Section -->
            <div class="col-md-4 p-4">
                <h2>Transport Planning</h2>
                <form id="transportForm" method="POST">
                    <div class="mb-3">
                        <label for="start_point" class="form-label">Starting Point</label>
                        <input type="text" class="form-control" id="start_point" name="start_point" required>
                    </div>
                    <div class="mb-3">
                        <label for="end_point" class="form-label">Destination</label>
                        <input type="text" class="form-control" id="end_point" name="end_point" required>
                    </div>
                    <div class="mb-3">
                        <label for="product_type" class="form-label">Product Type</label>
                        <select class="form-select" id="product_type" name="product_type" required>
                            <option value="general">General Cargo</option>
                            <option value="perishable">Perishable Goods</option>
                            <option value="hazardous">Hazardous Materials</option>
                            <option value="bulk">Bulk Cargo</option>
                        </select>
                    </div>
                    <h4>Priority Weights</h4>
                    <div class="mb-3">
                        <label for="time_weight" class="form-label">Time Importance (1-10)</label>
                        <input type="range" class="form-range" id="time_weight" name="time_weight" min="1" max="10" value="5">
                    </div>
                    <div class="mb-3">
                        <label for="cost_weight" class="form-label">Cost Importance (1-10)</label>
                        <input type="range" class="form-range" id="cost_weight" name="cost_weight" min="1" max="10" value="5">
                    </div>
                    <div class="mb-3">
                        <label for="carbon_weight" class="form-label">Carbon Footprint Importance (1-10)</label>
                        <input type="range" class="form-range" id="carbon_weight" name="carbon_weight" min="1" max="10" value="5">
                    </div>
                    <button type="submit" class="btn btn-primary">Calculate Route</button>
                </form>
            </div>
            
            <!-- Map Section -->
            <div class="col-md-8 p-0">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
